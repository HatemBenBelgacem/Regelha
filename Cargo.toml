[package]
name = "budgetplaner"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos Core & Routing
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }

# Shared Utilities & Domain Types (Client + Server)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "2.0"
http = "1.0"
tracing = "0.1"

# Client / Hydration Dependencies (WASM)
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Server / SSR Dependencies (Axum + PostgreSQL)
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "signal"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
], optional = true }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:tower",
    "dep:tower-http",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Optimiert das WASM-Bundle für Release-Builds
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# Name der generierten JS/WASM/CSS-Dateien in target/site/pkg/
output-name = "budgetplaner"

# Zielverzeichnis für den gebauten Server & Client
site-root = "target/site"
site-pkg-dir = "pkg"

# Tailwind CSS v4 + DaisyUI v5 Einstiegspunkt
tailwind-input-file = "style/tailwind.css"

# Statische Assets (Favicon, Bilder, etc.)
assets-dir = "public"

# Entwicklungs-Server-Konfiguration
site-addr = "127.0.0.1:3000"
reload-port = 3001

# Browserquery für Tailwind/Autoprefixer
browserquery = "defaults"

# Features für `cargo leptos` Server (bin) und Client (lib) Builds
bin-features = ["ssr"]
bin-default-features = false

lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
